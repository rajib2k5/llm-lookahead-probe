[project]
name = "llm-lookahead-probe"
version = "0.1.0"
description = "Tests whether an LLM trading agent's backtest is inflated by memorised history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
live = ["anthropic>=2.3"]  # 2.3.0 is the version exercised (local stub server)

[project.scripts]
llm-lookahead-probe = "llm_lookahead_probe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lookahead_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
# Validation probes are kept byte-for-byte as they were run (docs/validation/report.md); not linted.
extend-exclude = ["docs/validation/probes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
